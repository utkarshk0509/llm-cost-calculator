name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install typer rich tiktoken pytest ruff
      - name: Lint with Ruff
        run: ruff check .
      - name: Run Unit Tests
        run: PYTHONPATH=. pytest